Te ayudaré a crear un pipeline de Azure DevOps para .NET Framework con integración continua. Este pipeline compilará y validará tu código en la rama dev y luego promoverá los cambios a master.

Pipeline Azure DevOps - CI para .NET Framework
Código 
Te he creado un pipeline completo de CI para .NET Framework. Aquí está cómo funciona:

Características principales:
1. Flujo automático:

Se activa cuando hay commits en dev o master
Compila y prueba en dev
Si todo pasa, hace merge automático a master
Finalmente compila en master
2. Etapas del pipeline:

Build_and_Test: Compila el código de dev, ejecuta pruebas y publica artefactos
Merge_to_Master: Hace el merge automático de dev → master
Build_Master: Compila la rama master después del merge
Configuración necesaria:
1. Permisos del pipeline: Ve a: Project Settings → Repositories → Tu repositorio → Security

Busca el usuario [Nombre del Proyecto] Build Service
Otorga permisos: Contribute, Create branch, y Bypass policies when pushing
2. Guardar el archivo:

Guárdalo como azure-pipelines.yml en la raíz de tu repositorio
3. Crear el pipeline:

Ve a Azure DevOps → Pipelines → New Pipeline
Selecciona tu repositorio
Elige "Existing Azure Pipelines YAML file"
Selecciona el archivo azure-pipelines.yml
¿Necesitas alguna modificación? Por ejemplo:

Agregar aprobaciones manuales antes del merge
Configurar notificaciones
Agregar análisis de código
Configurar deployment a ambientes específicos
