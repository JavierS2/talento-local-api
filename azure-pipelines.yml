trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  publishDir: '$(System.DefaultWorkingDirectory)/publish'

stages:

# ======================
#   STAGE 1: BUILD (CI)
# ======================
- stage: Build
  displayName: "Build .NET API"
  jobs:
  - job: Build
    steps:

    - task: UseDotNet@2
      displayName: "Install .NET SDK"
      inputs:
        packageType: "sdk"
        version: "8.x"

    - script: dotnet restore
      displayName: "Restore"

    - script: dotnet build --configuration Release --no-restore
      displayName: "Build"

    - script: dotnet publish -c Release -o $(publishDir)
      displayName: "Publish"

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: "$(publishDir)"
        ArtifactName: "drop"

# ======================
#   STAGE 2: DEPLOY (CD)
# ======================
- stage: Deploy
  displayName: "Deploy to Azure App Service"
  dependsOn: Build
  condition: succeeded()

  jobs:
  - deployment: DeployWeb
    environment: "Production"
    strategy:
      runOnce:
        deploy:
          steps:

          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: "current"
              downloadType: "single"
              artifactName: "drop"
              downloadPath: "$(System.DefaultWorkingDirectory)"

          - task: AzureWebApp@1
            inputs:
              azureSubscription: "NombreDeTuServiceConnection"
              appType: "webAppLinux"
              appName: "talentolocal-api-dev"
              package: "$(System.DefaultWorkingDirectory)/drop"
