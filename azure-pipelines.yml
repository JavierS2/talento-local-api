trigger:
  branches:
    include:
      - master      # CI solo cuando haya push en master

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  publishDir: '$(Build.ArtifactStagingDirectory)'

steps:

# --- Instalar .NET (ajusta si usas net8.0) ---
- task: UseDotNet@2
  displayName: 'Instalar .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'   # IMPORTANTE: cambiar según tu version net8.0 o net7.0

# --- Restore ---
- script: dotnet restore
  displayName: 'dotnet restore'

# --- Build ---
- script: dotnet build --configuration Release --no-restore
  displayName: 'dotnet build'

# --- Publish ---
- script: dotnet publish -c Release -o $(publishDir)
  displayName: 'dotnet publish'

# --- Publicar artefactos para CD ---
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(publishDir)'
    ArtifactName: 'drop'
