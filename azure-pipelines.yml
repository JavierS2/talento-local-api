# Pipeline de Integración Continua para .NET Framework
# Compila en dev y promueve a master

trigger:
  branches:
    include:
      - dev
      - master

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

stages:
- stage: Build_and_Test
  displayName: 'Compilar y Probar en Dev'
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/dev')
  jobs:
  - job: BuildJob
    displayName: 'Compilación y Pruebas'
    steps:
    - task: NuGetToolInstaller@1
      displayName: 'Instalar NuGet'

    - task: NuGetCommand@2
      displayName: 'Restaurar paquetes NuGet'
      inputs:
        restoreSolution: '$(solution)'

    - task: VSBuild@1
      displayName: 'Compilar solución'
      inputs:
        solution: '$(solution)'
        msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:PackageLocation="$(build.artifactStagingDirectory)"'
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'

    - task: VSTest@2
      displayName: 'Ejecutar pruebas unitarias'
      inputs:
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'
      continueOnError: false

    - task: PublishBuildArtifacts@1
      displayName: 'Publicar artefactos'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: Merge_to_Master
  displayName: 'Promover a Master'
  dependsOn: Build_and_Test
  condition: succeeded()
  jobs:
  - job: MergeJob
    displayName: 'Merge Dev → Master'
    steps:
    - checkout: self
      persistCredentials: true
      clean: true

    - script: |
        git config --global user.email "pipeline@azuredevops.com"
        git config --global user.name "Azure Pipeline"
        git fetch origin
        git checkout -B master origin/master
        git merge origin/dev --no-ff -m "Auto-merge: dev → master [skip ci]"
        git push origin master
      displayName: 'Merge y Push a Master'

- stage: Build_Master
  displayName: 'Compilar Master'
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/master')
  jobs:
  - job: BuildMasterJob
    displayName: 'Compilación en Master'
    steps:
    - task: NuGetToolInstaller@1
      displayName: 'Instalar NuGet'

    - task: NuGetCommand@2
      displayName: 'Restaurar paquetes NuGet'
      inputs:
        restoreSolution: '$(solution)'

    - task: VSBuild@1
      displayName: 'Compilar solución'
      inputs:
        solution: '$(solution)'
        msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:PackageLocation="$(build.artifactStagingDirectory)"'
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publicar artefactos de Master'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'release'
        publishLocation: 'Container'
