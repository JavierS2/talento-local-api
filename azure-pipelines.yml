Perfecto, he corregido el script. Los cambios clave son:

Cambios realizados:

git fetch origin - Obtiene todas las referencias remotas actualizadas
git checkout -B master origin/master - Crea/actualiza la rama local master basándose en origin/master
El parámetro -B fuerza la creación de la rama local aunque no exista.

Si aún tienes problemas, aquí hay una versión alternativa más robusta:

yaml
- script: |
    git config --global user.email "pipeline@azuredevops.com"
    git config --global user.name "Azure Pipeline"
    git fetch origin master
    git fetch origin dev
    git checkout -b master origin/master || git checkout master
    git pull origin master
    git merge origin/dev --no-ff -m "Auto-merge: dev → master [skip ci]"
    git push origin master
  displayName: 'Merge y Push a Master'
